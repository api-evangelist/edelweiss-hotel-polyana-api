name: Edelweiss Hotel Polyana API

image: https://edelweiss-hotel.com.ua/images/og-main.webp

description: Public open REST API and structured data feeds for Edelweiss Hotel Polyana, a 3-star boutique eco-hotel in Polyana, Zakarpattia,
  Ukraine. Provides real-time room tariffs, hotel info, a Google Hotels XML pricing feed, quote calculation, and LLM knowledge bases. Open access,
  no authentication.

