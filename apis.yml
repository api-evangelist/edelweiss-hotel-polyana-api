  name: Edelweiss Hotel Polyana Markdown Room API
  description: Returns one room category as a Markdown document (text/markdown) for AI agents, with nightly rate, distance to the
    mineral spring pump room and room characteristics, in Ukrainian. GET /api/markdown/room/ returns the Standard room by default and
    takes a slug query parameter (for example ?slug=lux). Not described in the provider's OpenAPI.
  humanURL: https://edelweiss-hotel.com.ua/en/rooms/
  baseURL: https://edelweiss-hotel.com.ua/api/markdown/room/
