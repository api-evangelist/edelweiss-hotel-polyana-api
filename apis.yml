  name: Edelweiss Hotel MCP Server
  description: MCP server published by the hotel (io.github.kyivuinua/edelweiss-hotel-mcp) with four tools (get_hotel_tariffs,
    calculate_stay_quote, get_google_hotels_feed, search_faqs) backed by the hotel's public REST endpoints, and six resources (the
    llms.txt and llms-full.txt manifests in Ukrainian and English, the OpenAPI, and an FAQ knowledge base). Described at /.well-known/mcp-server.json;
