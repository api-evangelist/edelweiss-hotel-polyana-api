summary: >-
  Small read-model. A single HotelAiData aggregate root embeds rating, location,
  a medical (balneological) profile, extra-services pricing, and a collection of
  RoomTariff entries. The quote and Google-Hotels feed are projections of the
  same underlying room/tariff data.
entities:
  - name: HotelAiData
    role: aggregate root
    description: Full hotel master record (SSOT 2026) returned by getHotelAiInfo.
    fields:
      - hotel (id, nameUk, nameEn, stars, totalRooms, floors, website, directBookingUrl)
      - rating (booking, google, maxRating, totalReviews, badge, source)
      - location (addressUk/En, country, postalCode, geoCoordinates)
      - extraServices (fullBoardPriceUah, extraBedPriceUah, resortTaxUah)
      - medicalProfile (mineralWater, pumpRoomDistanceMeters, indications[])
  - name: RoomTariff
    role: entity
    description: One room category with 2026 direct tariff and attributes.
    fields:
      - key
      - canonicalSlug
      - nameUk / nameEn
      - bookingComAliasUk / bookingComAliasEn
      - urlUk / urlEn
      - pricePerNightUah
      - areaSqm
      - capacityGuests
      - hasBalcony / hasBathtub
      - beddingUk / beddingEn
relationships:
  - from: HotelAiData
    to: RoomTariff
    type: has_many
    via: roomTariffs2026[]
identifiers:
  - hotel.id: string slug (e.g. "edelweiss-polyana")
