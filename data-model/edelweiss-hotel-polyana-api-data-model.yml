source: openapi/edelweiss-hotel-polyana-api-openapi.json components.schemas
summary: >-
  Small read-model. A single HotelAiData aggregate root embeds rating, location,
  a medical (balneological) profile, extra-services pricing, and a collection of
  RoomTariff entries. The quote and Google-Hotels feed are projections of the
  same underlying room/tariff data.
entities:
  - name: HotelAiData
    role: aggregate root
    description: Full hotel master record (SSOT 2026) returned by getHotelAiInfo.
    fields:
      - hotel (id, nameUk, nameEn, stars, totalRooms, floors, website, directBookingUrl)
      - rating (booking, google, maxRating, totalReviews, badge, source)
      - location (addressUk/En, country, postalCode, geoCoordinates)
      - extraServices (fullBoardPriceUah, extraBedPriceUah, resortTaxUah)
      - medicalProfile (mineralWater, pumpRoomDistanceMeters, indications[])
  - name: RoomTariff
    role: entity
    description: One room category with 2026 direct tariff and attributes.
    fields:
      - key
      - canonicalSlug
      - nameUk / nameEn
      - bookingComAliasUk / bookingComAliasEn
      - urlUk / urlEn
      - pricePerNightUah
      - areaSqm
      - capacityGuests
      - hasBalcony / hasBathtub
      - beddingUk / beddingEn
  - name: Review
    role: entity
    description: A single verified guest review from Booking.com.
    fields:
      - id
      - author
      - rating
      - source
      - content
      - date
  - name: ReviewsResponse
    role: value object
    description: Paginated collection of reviews with aggregate stats.
    fields:
      - reviews (Review[])
      - total
      - averageRating
      - source
      - badge
relationships:
  - from: HotelAiData
    to: RoomTariff
    type: has_many
    via: roomTariffs2026[]
  - from: ReviewsResponse
    to: Review
    type: has_many
    via: reviews[]
identifiers:
  - hotel.id: string slug (e.g. "edelweiss-polyana")
  - RoomTariff.canonicalSlug: booking/quote key (standart, superior-triple, classic-lux, lux)
  - Review.id: integer (WordPress post ID)
notes: >-
  The Google Hotels XML feed (getGoogleHotelsXml) and the quote calculator
  (calculateStayQuote) are read projections over the same room/tariff data; they
  add no new persisted entities. The /api/reviews endpoint returns verified
  Booking.com reviews. The /api/markdown/room endpoint returns structured
  Markdown for a specific room category.
